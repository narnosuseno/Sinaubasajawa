<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembelajaran Aksara Jawa</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&amp;family=Source+Sans+3:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
  <style>
        .aksara-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .aksara-card:hover { transform: translateY(-4px) scale(1.02); }
        .tab-active { border-bottom: 3px solid var(--accent); background: rgba(139, 69, 19, 0.08); }
        .fade-in { animation: fadeIn 0.5s ease forwards; opacity: 0; }
        @keyframes fadeIn { to { opacity: 1; } }
        .quiz-option { transition: all 0.2s; }
        .quiz-option:hover { transform: scale(1.03); }
        .quiz-correct { background: #d4edda !important; border-color: #28a745 !important; }
        .quiz-wrong { background: #f8d7da !important; border-color: #dc3545 !important; }
        .nav-btn { transition: all 0.2s; }
        .nav-btn:hover { transform: translateY(-2px); }
        :root {
            --bg: #fdf6e3;
            --surface: #ffffff;
            --text: #3b2f1e;
            --accent: #8b4513;
            --secondary: #c97b3a;
        }
    </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full" style="background: var(--bg); color: var(--text); font-family: 'Source Sans 3', sans-serif;">
  <div id="app" class="h-full w-full overflow-auto"><!-- Header -->
   <header class="text-center py-6 px-4" style="background: linear-gradient(135deg, var(--accent), #5c2e0a);">
    <div class="max-w-4xl mx-auto">
     <h1 id="main-title" class="text-3xl md:text-4xl font-black text-white" style="font-family: 'Playfair Display', serif;">Aksara Jawa</h1>
     <p id="school-label" class="text-amber-200 mt-1 text-sm">MTs Ma'arif Jumo</p>
     <p id="teacher-label" class="text-amber-300 text-xs mt-0.5">Oleh: Narno Suseno, S.Pd</p>
    </div>
   </header><!-- Navigation Tabs -->
   <nav class="flex justify-center gap-1 px-2 py-3 flex-wrap max-w-4xl mx-auto"><button onclick="switchTab('legena')" id="tab-legena" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold tab-active" style="color: var(--accent);">Aksara Legena</button> <button onclick="switchTab('sandhangan')" id="tab-sandhangan" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold" style="color: var(--accent);">Sandhangan</button> <button onclick="switchTab('rekan')" id="tab-rekan" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold" style="color: var(--accent);">Aksara Rekan</button> <button onclick="switchTab('quiz')" id="tab-quiz" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold" style="color: var(--accent);">Kuis</button>
   </nav><!-- Content -->
   <main class="max-w-4xl mx-auto px-4 pb-8" id="content-area"></main>
  </div>
  <script>
const defaultConfig = {
    school_name: "MTs Ma'arif Jumo",
    teacher_name: "Narno Suseno, S.Pd",
    background_color: "#fdf6e3",
    surface_color: "#ffffff",
    text_color: "#3b2f1e",
    accent_color: "#8b4513",
    secondary_color: "#c97b3a",
    font_family: "Playfair Display",
    font_size: 16
};

// Aksara Legena data
const legena = [
    {latin:"Ha",jawa:"ꦲ"},{latin:"Na",jawa:"ꦤ"},{latin:"Ca",jawa:"ꦕ"},{latin:"Ra",jawa:"ꦫ"},{latin:"Ka",jawa:"ꦏ"},
    {latin:"Da",jawa:"ꦢ"},{latin:"Ta",jawa:"ꦠ"},{latin:"Sa",jawa:"ꦱ"},{latin:"Wa",jawa:"ꦮ"},{latin:"La",jawa:"ꦭ"},
    {latin:"Pa",jawa:"ꦥ"},{latin:"Dha",jawa:"ꦝ"},{latin:"Ja",jawa:"ꦗ"},{latin:"Ya",jawa:"ꦪ"},{latin:"Nya",jawa:"ꦚ"},
    {latin:"Ma",jawa:"ꦩ"},{latin:"Ga",jawa:"ꦒ"},{latin:"Ba",jawa:"ꦧ"},{latin:"Tha",jawa:"ꦛ"},{latin:"Nga",jawa:"ꦔ"}
];

// Sandhangan (tanda baca)
const sandhangan = [
    {nama:"Wulu",fungsi:"Vokal i",simbol:"ꦶ",contoh:"ꦲꦶꦏꦶ (iki)"},
    {nama:"Suku",fungsi:"Vokal u",simbol:"ꦸ",contoh:"ꦲꦸꦭꦸ (ulu)"},
    {nama:"Pepet",fungsi:"Vokal ê",simbol:"ꦼ",contoh:"ꦭꦼꦩꦃ (lemah)"},
    {nama:"Taling",fungsi:"Vokal é/è",simbol:"ꦺ",contoh:"ꦺꦱꦺꦏ (sésék)"},
    {nama:"Taling Tarung",fungsi:"Vokal o",simbol:"ꦺꦴ",contoh:"ꦺꦲꦴꦫ (ora)"},
    {nama:"Layar",fungsi:"Konsonan r mati",simbol:"ꦂ",contoh:"ꦥꦂꦠ (parta)"},
    {nama:"Wignyan",fungsi:"Konsonan h mati",simbol:"ꦃ",contoh:"ꦱꦃ (sah)"},
    {nama:"Cecak",fungsi:"Konsonan ng mati",simbol:"ꦁ",contoh:"ꦭꦁ (lang)"},
    {nama:"Pangkon",fungsi:"Menghilangkan vokal",simbol:"꧀",contoh:"ꦲꦤꦏ꧀ (anak)"},
    {nama:"Cakra",fungsi:"Konsonan r + a",simbol:"ꦿ",contoh:"ꦏꦿꦠꦺꦴꦤ꧀ (kraton)"}
];

// Aksara Rekan
const rekan = [
    {latin:"Fa",jawa:"ꦥ꦳",asal:"Pa + cecak telu"},
    {latin:"Za",jawa:"ꦗ꦳",asal:"Ja + cecak telu"},
    {latin:"Gha",jawa:"ꦒ꦳",asal:"Ga + cecak telu"},
    {latin:"Va",jawa:"ꦮ꦳",asal:"Wa + cecak telu"},
    {latin:"Kha",jawa:"ꦏ꦳",asal:"Ka + cecak telu"}
];

let currentTab = 'legena';
let quizState = { questions: [], current: 0, score: 0, answered: false };

function switchTab(tab) {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active'));
    document.getElementById('tab-' + tab).classList.add('tab-active');
    currentTab = tab;
    renderContent();
}

function renderContent() {
    const area = document.getElementById('content-area');
    if (currentTab === 'legena') renderLegena(area);
    else if (currentTab === 'sandhangan') renderSandhangan(area);
    else if (currentTab === 'rekan') renderRekan(area);
    else renderQuiz(area);
}

function renderLegena(area) {
    area.innerHTML = `
        <div class="text-center mb-4 fade-in">
            <h2 class="text-xl font-bold" style="font-family:'Playfair Display',serif; color:var(--accent);">Aksara Legena (Aksara Pokok)</h2>
            <p class="text-sm mt-1 opacity-75">20 aksara dasar yang menjadi fondasi penulisan huruf Jawa</p>
        </div>
        <div class="grid grid-cols-4 sm:grid-cols-5 gap-3">
            ${legena.map((a, i) => `
                <div class="aksara-card rounded-xl p-3 text-center cursor-pointer shadow-sm fade-in" 
                     style="background:var(--surface); animation-delay:${i*40}ms; border:1px solid rgba(139,69,19,0.15);"
                     onclick="speakAksara('${a.latin}')">
                    <div class="text-3xl md:text-4xl mb-1" style="color:var(--accent);">${a.jawa}</div>
                    <div class="text-xs font-semibold" style="color:var(--secondary);">${a.latin}</div>
                </div>
            `).join('')}
        </div>
        <div class="mt-6 p-4 rounded-xl fade-in" style="background:var(--surface); border:1px solid rgba(139,69,19,0.1); animation-delay:600ms;">
            <p class="text-sm font-semibold" style="color:var(--accent);">💡 Tip:</p>
            <p class="text-sm mt-1">Hafal urutan aksara dengan kalimat: <em>"Hana Caraka, Data Sawala, Padha Jayanya, Maga Bathanga"</em></p>
        </div>`;
}

function renderSandhangan(area) {
    area.innerHTML = `
        <div class="text-center mb-4 fade-in">
            <h2 class="text-xl font-bold" style="font-family:'Playfair Display',serif; color:var(--accent);">Sandhangan (Tanda Baca)</h2>
            <p class="text-sm mt-1 opacity-75">Tanda baca untuk mengubah bunyi vokal dan konsonan</p>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${sandhangan.map((s, i) => `
                <div class="aksara-card rounded-xl p-4 shadow-sm fade-in" style="background:var(--surface); animation-delay:${i*60}ms; border:1px solid rgba(139,69,19,0.12);">
                    <div class="flex items-center gap-3">
                        <div class="text-3xl w-12 text-center" style="color:var(--accent);">${s.simbol}</div>
                        <div class="flex-1">
                            <div class="font-bold text-sm" style="color:var(--accent);">${s.nama}</div>
                            <div class="text-xs opacity-75">${s.fungsi}</div>
                            <div class="text-xs mt-1" style="color:var(--secondary);">Contoh: ${s.contoh}</div>
                        </div>
                    </div>
                </div>
            `).join('')}
        </div>`;
}

function renderRekan(area) {
    area.innerHTML = `
        <div class="text-center mb-4 fade-in">
            <h2 class="text-xl font-bold" style="font-family:'Playfair Display',serif; color:var(--accent);">Aksara Rekan</h2>
            <p class="text-sm mt-1 opacity-75">Aksara untuk menulis kata serapan dari bahasa asing</p>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${rekan.map((r, i) => `
                <div class="aksara-card rounded-xl p-5 text-center shadow-sm fade-in" style="background:var(--surface); animation-delay:${i*80}ms; border:1px solid rgba(139,69,19,0.12);">
                    <div class="text-4xl mb-2" style="color:var(--accent);">${r.jawa}</div>
                    <div class="font-bold" style="color:var(--secondary);">${r.latin}</div>
                    <div class="text-xs mt-1 opacity-70">${r.asal}</div>
                </div>
            `).join('')}
        </div>
        <div class="mt-6 p-4 rounded-xl fade-in" style="background:var(--surface); border:1px solid rgba(139,69,19,0.1); animation-delay:500ms;">
            <p class="text-sm font-semibold" style="color:var(--accent);">📝 Catatan:</p>
            <p class="text-sm mt-1">Aksara Rekan dibentuk dengan menambahkan <strong>cecak telu</strong> (tiga titik) di bawah aksara dasar. Digunakan untuk menulis kata seperti: Fatimah, Zakat, dll.</p>
        </div>`;
}

function generateQuiz() {
    const questions = [];
    const pool = [...legena];
    for (let i = 0; i < 10; i++) {
        const correct = pool[Math.floor(Math.random() * pool.length)];
        const options = [correct];
        while (options.length < 4) {
            const r = pool[Math.floor(Math.random() * pool.length)];
            if (!options.includes(r)) options.push(r);
        }
        options.sort(() => Math.random() - 0.5);
        questions.push({ aksara: correct.jawa, answer: correct.latin, options: options.map(o => o.latin) });
    }
    quizState = { questions, current: 0, score: 0, answered: false };
}

function renderQuiz(area) {
    if (quizState.questions.length === 0) generateQuiz();
    const q = quizState.questions[quizState.current];
    if (!q) { renderQuizResult(area); return; }

    area.innerHTML = `
        <div class="text-center mb-4 fade-in">
            <h2 class="text-xl font-bold" style="font-family:'Playfair Display',serif; color:var(--accent);">Kuis Aksara Jawa</h2>
            <p class="text-sm opacity-75">Soal ${quizState.current + 1} dari ${quizState.questions.length} | Skor: ${quizState.score}</p>
        </div>
        <div class="rounded-xl p-6 text-center fade-in" style="background:var(--surface); border:1px solid rgba(139,69,19,0.12);">
            <p class="text-sm mb-2 opacity-70">Aksara di bawah ini berbunyi apa?</p>
            <div class="text-6xl my-4" style="color:var(--accent);">${q.aksara}</div>
            <div class="grid grid-cols-2 gap-3 mt-4 max-w-md mx-auto">
                ${q.options.map(opt => `
                    <button onclick="answerQuiz('${opt}')" class="quiz-option rounded-lg p-3 font-semibold text-lg border-2" 
                            style="border-color:var(--secondary); color:var(--text); background:var(--bg);"
                            ${quizState.answered ? 'disabled' : ''}>
                        ${opt}
                    </button>
                `).join('')}
            </div>
            <div id="quiz-feedback" class="mt-4 text-sm font-semibold"></div>
        </div>`;
}

function answerQuiz(selected) {
    if (quizState.answered) return;
    quizState.answered = true;
    const q = quizState.questions[quizState.current];
    const buttons = document.querySelectorAll('.quiz-option');
    buttons.forEach(btn => {
        if (btn.textContent.trim() === q.answer) btn.classList.add('quiz-correct');
        else if (btn.textContent.trim() === selected && selected !== q.answer) btn.classList.add('quiz-wrong');
        btn.disabled = true;
    });
    if (selected === q.answer) quizState.score++;
    const fb = document.getElementById('quiz-feedback');
    fb.innerHTML = selected === q.answer 
        ? '<span style="color:#28a745;">✓ Benar!</span>' 
        : `<span style="color:#dc3545;">✗ Salah. Jawaban: ${q.answer}</span>`;
    setTimeout(() => { quizState.current++; quizState.answered = false; renderContent(); }, 1500);
}

function renderQuizResult(area) {
    area.innerHTML = `
        <div class="rounded-xl p-8 text-center fade-in" style="background:var(--surface); border:1px solid rgba(139,69,19,0.12);">
            <div class="text-5xl mb-4">${quizState.score >= 8 ? '🎉' : quizState.score >= 5 ? '👍' : '💪'}</div>
            <h2 class="text-2xl font-bold" style="color:var(--accent); font-family:'Playfair Display',serif;">Kuis Selesai!</h2>
            <p class="text-lg mt-2">Skor: <strong>${quizState.score}</strong> / ${quizState.questions.length}</p>
            <p class="text-sm mt-1 opacity-70">${quizState.score >= 8 ? 'Luar biasa! Kamu sangat menguasai aksara Jawa!' : quizState.score >= 5 ? 'Bagus! Terus belajar ya!' : 'Jangan menyerah, coba lagi!'}</p>
            <button onclick="generateQuiz(); renderContent();" class="mt-4 px-6 py-2 rounded-lg text-white font-semibold" style="background:var(--accent);">Coba Lagi</button>
        </div>`;
}

function speakAksara(text) {
    if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'id-ID'; u.rate = 0.8;
        speechSynthesis.speak(u);
    }
}

// Element SDK
window.elementSdk.init({
    defaultConfig,
    onConfigChange: async (config) => {
        const r = document.documentElement;
        r.style.setProperty('--bg', config.background_color || defaultConfig.background_color);
        r.style.setProperty('--surface', config.surface_color || defaultConfig.surface_color);
        r.style.setProperty('--text', config.text_color || defaultConfig.text_color);
        r.style.setProperty('--accent', config.accent_color || defaultConfig.accent_color);
        r.style.setProperty('--secondary', config.secondary_color || defaultConfig.secondary_color);
        document.body.style.color = config.text_color || defaultConfig.text_color;
        document.body.style.background = config.background_color || defaultConfig.background_color;
        const font = config.font_family || defaultConfig.font_family;
        document.getElementById('main-title').style.fontFamily = `${font}, serif`;
        const size = config.font_size || defaultConfig.font_size;
        document.body.style.fontSize = size + 'px';
        document.getElementById('school-label').textContent = config.school_name || defaultConfig.school_name;
        document.getElementById('teacher-label').textContent = 'Oleh: ' + (config.teacher_name || defaultConfig.teacher_name);
    },
    mapToCapabilities: (config) => ({
        recolorables: [
            { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
            { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
            { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
            { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } },
            { get: () => config.secondary_color || defaultConfig.secondary_color, set: (v) => { config.secondary_color = v; window.elementSdk.setConfig({ secondary_color: v }); } }
        ],
        borderables: [],
        fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
        fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
    }),
    mapToEditPanelValues: (config) => new Map([
        ["school_name", config.school_name || defaultConfig.school_name],
        ["teacher_name", config.teacher_name || defaultConfig.teacher_name]
    ])
});

renderContent();
lucide.createIcons();
</script>
